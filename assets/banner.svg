      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <g opacity=".18" stroke="#93c5fd">
