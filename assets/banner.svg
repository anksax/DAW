    <path d="M0 355 C180 320 260 400 430 350 S720 310 900 352 1160 405 1400 342" fill="none" stroke-width="1"/>
  </g>
  <g transform="translate(920 70)" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round">
    <rect x="0" y="0" width="340" height="250" rx="28" opacity=".78"/>
    <circle cx="92" cy="82" r="44"/>
    <circle cx="248" cy="82" r="44"/>
    <path d="M45 176 H295"/>
    <path d="M70 210 H270"/>
    <g stroke-width="12" filter="url(#glow)">
      <path d="M50 176 v-34"/>
      <path d="M82 176 v-62"/>
      <path d="M114 176 v-26"/>
      <path d="M146 176 v-84"/>
      <path d="M178 176 v-48"/>
      <path d="M210 176 v-96"/>
      <path d="M242 176 v-56"/>
