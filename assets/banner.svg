  <text x="92" y="292" fill="#cbd5e1" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="28">A standalone FLAC player, effects engine & embedded workstation</text>
  <text x="92" y="340" fill="#7dd3fc" font-family="Consolas,Menlo,monospace" font-size="22">FLAC → PCM DSP → I2S DAC • ST7789 + SH1106 • Hardware controls</text>
