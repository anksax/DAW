  <text x="92" y="120" fill="#f8fafc" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="4">ESP32-S3 • LOSSLESS • REAL-TIME DSP</text>
  <text x="88" y="205" fill="#ffffff" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="64" font-weight="800">DJ Audio Console</text>
