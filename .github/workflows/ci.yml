name: Firmware CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile ESP32-S3 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 package index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "U8g2"
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/pschatzmann/arduino-audio-tools.git "$HOME/Arduino/libraries/audio-tools"
          git clone --depth 1 https://github.com/pschatzmann/codec-libfoxenflac.git "$HOME/Arduino/libraries/codec-libfoxenflac"

      - name: Prepare Arduino sketch directory
        run: |
          mkdir -p build-sketch/DJ_Audio_Console_V4
          cp DJ_Audio_Console_V4.ino build-sketch/DJ_Audio_Console_V4/DJ_Audio_Console_V4.ino

      - name: Compile for ESP32-S3
        run: |
          arduino-cli compile             --fqbn esp32:esp32:esp32s3             --warnings all             build-sketch/DJ_Audio_Console_V4
